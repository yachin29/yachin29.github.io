<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="画像をブラウザー内で一括 WebP 変換・リサイズできるツール"
    />
    <title>WebP Bulk Converter</title>
    <meta name="theme-color" content="#f8fafc" />
    <script>
      const savedTheme = localStorage.getItem("web-tools-theme");
      const isDark = savedTheme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      document.querySelector('meta[name="theme-color"]').content = isDark
        ? "#020617"
        : "#f8fafc";
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div class="mx-auto max-w-4xl px-4 py-8 sm:px-6 sm:py-12">
      <header class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex flex-col">
          <a href="../" class="mb-4 inline-flex rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-semibold text-slate-300 transition hover:border-slate-500 hover:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-400">
          ← Web Dev Tools
        </a>
          <div>
            <p class="mb-2 text-sm font-medium text-indigo-500">IMAGE OPTIMIZATION TOOL</p>
            <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">WebP Bulk Converter</h1>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">画像をブラウザー内で一括 WebP 変換・軽量化。ファイルはサーバーに送信されません。</p>
          </div>
        </div>
        <button id="theme-toggle" type="button" class="shrink-0 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-indigo-500 hover:text-indigo-700 dark:border-slate-700 dark:text-slate-200 dark:hover:text-white" aria-pressed="false">
          ダークモードに切り替え
        </button>
      </header>

      <main class="space-y-6">
        <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-xl shadow-black/10 sm:p-7 dark:border-slate-800 dark:bg-slate-900" aria-labelledby="settings-heading">
          <h2 id="settings-heading" class="mb-6 text-lg font-semibold">変換設定</h2>
          <div>
            <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
              <label for="quality" class="text-sm font-medium text-slate-700 dark:text-slate-300">画質</label>
              <output id="quality-value" for="quality" class="font-mono text-sm font-semibold text-indigo-700 dark:text-indigo-300">80%</output>
            </div>
            <input id="quality" class="w-full cursor-pointer accent-indigo-500" type="range" min="1" max="100" value="80" aria-label="WebP画質" />
            <div class="mt-3 flex flex-wrap gap-2" aria-label="画質プリセット">
              <button type="button" data-quality="75" class="preset-button rounded-full border border-slate-300 px-3 py-1.5 text-xs text-slate-700 transition hover:border-indigo-500 dark:border-slate-700 dark:text-slate-300">75% 軽量</button>
              <button type="button" data-quality="80" class="preset-button rounded-full border border-slate-300 px-3 py-1.5 text-xs text-slate-700 transition hover:border-indigo-500 dark:border-slate-700 dark:text-slate-300">80% 標準</button>
              <button type="button" data-quality="90" class="preset-button rounded-full border border-slate-300 px-3 py-1.5 text-xs text-slate-700 transition hover:border-indigo-500 dark:border-slate-700 dark:text-slate-300">90% 高画質</button>
            </div>
          </div>

          <div class="mt-7">
            <label class="flex items-center gap-2 text-sm font-medium text-slate-700 dark:text-slate-300">
              <input id="resize-enabled" type="checkbox" class="h-4 w-4 rounded border-slate-300 bg-white text-indigo-500 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-800" />
              最大横幅を指定してリサイズする
            </label>
            <div class="mt-3 flex flex-wrap items-center gap-2">
              <label for="max-width" class="sr-only">最大横幅（px）</label>
              <input id="max-width" class="w-32 rounded-lg border border-slate-300 bg-white px-3 py-2 font-mono text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white" type="number" min="1" step="1" value="1920" />
              <span class="text-sm text-slate-600 dark:text-slate-500">px</span>
              <span class="ml-1 text-xs text-slate-500 dark:text-slate-400">プリセット:</span>
              <button type="button" data-width="1200" class="preset-button rounded-full border border-slate-300 px-3 py-1.5 text-xs text-slate-700 transition hover:border-indigo-500 dark:border-slate-700 dark:text-slate-300">1200px</button>
              <button type="button" data-width="1920" class="preset-button rounded-full border border-slate-300 px-3 py-1.5 text-xs text-slate-700 transition hover:border-indigo-500 dark:border-slate-700 dark:text-slate-300">1920px</button>
              <button type="button" data-width="2560" class="preset-button rounded-full border border-slate-300 px-3 py-1.5 text-xs text-slate-700 transition hover:border-indigo-500 dark:border-slate-700 dark:text-slate-300">2560px</button>
            </div>
            <p id="settings-error" class="mt-2 min-h-5 text-sm text-rose-600 dark:text-rose-400" role="status"></p>
          </div>

          <div class="mt-4">
            <label for="suffix" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">ファイル名の接尾辞（任意）</label>
            <input id="suffix" class="w-full max-w-sm rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white" type="text" placeholder="例: -min" />
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">例: photo.jpg → photo-min.webp</p>
          </div>
        </section>

        <section aria-labelledby="drop-heading">
          <h2 id="drop-heading" class="sr-only">画像を追加</h2>
          <div id="dropzone" class="cursor-pointer rounded-2xl border-2 border-dashed border-slate-300 bg-white px-5 py-10 text-center transition hover:border-indigo-500 hover:bg-indigo-50/50 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-900/80" role="button" tabindex="0" aria-label="画像を追加。クリック、Enter、Space、またはドラッグ＆ドロップ">
            <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-indigo-100 text-2xl dark:bg-indigo-950" aria-hidden="true">＋</div>
            <p class="font-semibold">ここに画像をドラッグ＆ドロップ（複数可）</p>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">またはクリックしてファイルを選択</p>
            <p class="mt-3 text-xs text-slate-500 dark:text-slate-500">JPG / PNG / GIF / WebP</p>
          </div>
          <input id="file-input" class="sr-only" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple />
          <p id="progress" class="mt-3 min-h-5 text-center text-sm text-indigo-700 dark:text-indigo-300" role="status" aria-live="polite"></p>
        </section>

        <section id="results" class="hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-xl shadow-black/10 sm:p-7 dark:border-slate-800 dark:bg-slate-900" aria-labelledby="results-heading">
          <div class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 id="results-heading" class="text-lg font-semibold">変換結果</h2>
              <p id="summary" class="mt-1 text-sm text-slate-600 dark:text-slate-400" aria-live="polite"></p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="clear-all" type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-rose-400 hover:text-rose-700 dark:border-slate-700 dark:text-slate-200 dark:hover:text-rose-300">すべてクリア</button>
              <button id="download-zip" type="button" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">📦 ZIPで一括保存</button>
            </div>
          </div>
          <p id="zip-error" class="mb-3 text-sm text-rose-600 dark:text-rose-400" role="status"></p>
          <ul id="file-list" class="divide-y divide-slate-200 dark:divide-slate-800"></ul>
        </section>
      </main>
      <footer class="mt-8 text-center text-xs text-slate-500 dark:text-slate-500">変換はお使いのブラウザー内で行われます。画像は外部へ送信されません。</footer>
    </div>
  </body>
</html>
